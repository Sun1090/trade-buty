<!doctype html>
<html lang="zh-CN" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <title>离线 · Trade Buty</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0a0d14;
        --surface: #121722;
        --border: #232b3b;
        --foreground: #e6eaf2;
        --muted: #9aa4b8;
        --faint: #6b7488;
        --accent: #34d399;
        --accent-strong: #10b981;
        --on-accent: #06281c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 560px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        padding: 32px 28px;
      }
      .brand {
        margin: 0 0 20px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.3;
      }
      .en {
        color: var(--muted);
      }
      p {
        margin: 12px 0 0;
        font-size: 15px;
      }
      ul {
        margin: 16px 0 0;
        padding-left: 20px;
        color: var(--muted);
        font-size: 14px;
      }
      .actions {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      button,
      a.home {
        min-height: 44px;
        padding: 11px 20px;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }
      button {
        border: 0;
        background: var(--accent-strong);
        color: var(--on-accent);
      }
      button:hover {
        background: var(--accent);
      }
      a.home {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border);
        color: var(--foreground);
        text-decoration: none;
      }
      a.home:hover {
        border-color: var(--accent);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #status {
        margin-top: 16px;
        font-size: 13px;
        color: var(--faint);
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --background: #f6f8fb;
          --surface: #ffffff;
          --border: #dfe4ec;
          --foreground: #131a26;
          --muted: #4d5766;
          --faint: #6b7488;
          --on-accent: #06281c;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Trade Buty</p>
      <h1>你现在处于离线状态</h1>
      <p class="en" lang="en">You are offline.</p>
      <p>
        已读进度、错题本和练习记录保存在本机，不会因为断网丢失。课程内容、搜索、AI
        答疑和行情图表需要联网后才能继续。
      </p>
      <ul>
        <li>检查 Wi-Fi 或移动数据是否可用</li>
        <li>连接恢复后点击下方按钮重新加载</li>
      </ul>
      <div class="actions">
        <button type="button" id="retry">重新连接 / Retry</button>
        <a class="home" href="/zh">返回首页（需联网）</a>
      </div>
      <p id="status" role="status" aria-live="polite">
        等待网络恢复，恢复后会自动重新加载。
      </p>
    </main>
    <script>
      (function () {
        var status = document.getElementById("status");
        var retry = document.getElementById("retry");
        var BUDGET_KEY = "tb-offline-auto-reloads";
        var BUDGET_WINDOW_MS = 30000;
        var MAX_AUTO_RELOADS = 3;
        var MAX_PROBE_ATTEMPTS = 6;

        function readBudget() {
          try {
            var raw = JSON.parse(sessionStorage.getItem(BUDGET_KEY) || "null");
            if (raw && Date.now() - raw.t < BUDGET_WINDOW_MS) return raw.n;
          } catch (e) {
            /* sessionStorage 不可用（隐私模式）或值损坏：按没用过处理 */
          }
          return 0;
        }
        function spendBudget() {
          try {
            sessionStorage.setItem(
              BUDGET_KEY,
              JSON.stringify({ n: readBudget() + 1, t: Date.now() })
            );
          } catch (e) {
            /* 记不了账只是少一层保险，不影响恢复本身 */
          }
        }
        function resetBudget() {
          try {
            sessionStorage.removeItem(BUDGET_KEY);
          } catch (e) {
            /* 同上 */
          }
        }

        retry.addEventListener("click", function () {
          status.textContent = "正在重试… / Retrying…";
          resetBudget();
          location.reload();
        });

        // 只有同源请求真的通了才重新加载。online 一到就 reload 不够：那次导航可能抢在
        // 网络栈恢复之前落地，被 service worker 又送回这一页，而 online 已经用过、不会
        // 有第二次——用户就停在「已联网的离线页」上出不来（本地实测 3 次里 2 次如此）。
        function probe(attempt) {
          fetch(location.pathname, { method: "HEAD", cache: "no-store" }).then(
            function () {
              if (readBudget() >= MAX_AUTO_RELOADS) {
                status.textContent =
                  "网络已恢复，请点击上方按钮重新加载。 / Back online — use Retry above.";
                return;
              }
              status.textContent =
                "网络已恢复，正在重新加载… / Back online, reloading…";
              spendBudget();
              location.reload();
            },
            function () {
              if (!navigator.onLine || attempt >= MAX_PROBE_ATTEMPTS) return;
              setTimeout(function () {
                probe(attempt + 1);
              }, 500 * (attempt + 1));
            }
          );
        }

        window.addEventListener("online", function () {
          probe(0);
        });
        // 这一份文档也可能正是「reload 抢跑」后又被送回兜底页的那一份：那时 online 已经
        // 触发过，所以开局就在线必须自己探一次。
        if (navigator.onLine) probe(0);
      })();
    </script>
  </body>
</html>
