name: Link Patrol

# R6.12：知识库外链月度巡检（可手动触发）
on:
  schedule:
    - cron: "0 3 1 * *" # 每月 1 日 03:00 UTC
  workflow_dispatch:

# 最小权限：巡检只读取仓库内容。
permissions:
  contents: read

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ops:link-patrol
