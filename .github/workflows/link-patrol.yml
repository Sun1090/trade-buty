name: Link Patrol

# R6.12：知识库外链月度巡检（可手动触发）
on:
  schedule:
    - cron: "0 3 1 * *" # 每月 1 日 03:00 UTC
  workflow_dispatch:

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ops:link-patrol
