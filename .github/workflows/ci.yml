name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - name: 构建时间监控（R7.10：>3 分钟报警）
        id: buildtime
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: 构建耗时核对（R7.10）
        run: |
          ELAPSED=$(( $(date +%s) - ${{ steps.buildtime.outputs.start }} ))
          echo "build segment elapsed: ${ELAPSED}s (includes lint/test/typecheck)"
          if [ "$ELAPSED" -gt 240 ]; then
            echo "::warning::构建链路超过 4 分钟（${ELAPSED}s），请检查大 chunk 与依赖体积"
          fi
      - run: npm run check:ai-copy
      - run: npm run check:constitution
      - run: npm run check:frontmatter
      - run: npm run check:image-alt
      - run: npm run check:quiz-mounts
      - run: npm run check:quiz-coverage
      - run: npm run check:links
      - run: npm run check:sitemap
      - run: npm run check:search-index
      - run: npm run check:bundle
      # E2E 放最后：运行时会向 .next 写入动态 fallback 页，避免污染产物校验
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run lhci
