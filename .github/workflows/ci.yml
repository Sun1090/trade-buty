name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:ai-copy
      - run: npm run check:constitution
      - run: npm run check:frontmatter
      - run: npm run check:image-alt
      - run: npm run check:quiz-mounts
      - run: npm run check:quiz-coverage
      - run: npm run check:links
      - run: npm run check:sitemap
      - run: npm run check:search-index
      - run: npm run check:bundle
      - run: npm run lhci
