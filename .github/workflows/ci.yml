name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：只读仓库内容与 PR 元数据（R14.4 工作保全审计需要列出关闭未合并的 PR），
# 不需要任何写 token / issue 权限。
permissions:
  contents: read
  pull-requests: read

# 同一 PR 连续 push 时取消被取代的运行（否则一次 push 会并行占用多份 runner）；
# main 的 push 用 run_id 分组，保持每次提交都有独立的完整门禁结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # 上界保护：正常约 6 分钟，卡死时避免占用 runner 默认的 6 小时上限。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          # R14.3：check:release-tag 需要读 tag；不依赖 checkout 的默认值。
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check:lockfile-repro
      - run: npm run audit:prod
      - run: npm run audit:all
      - run: npm run check:secrets
      - name: 工作保全审计（R14.4：关闭未合并的 PR 必须先确认工作去向）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORK_AUDIT_REQUIRE_GH: "1"
        run: |
          # 审计用 origin/main 比对补丁是否落地；actions/checkout 默认只取当前 ref，
          # 不补这一条就等于让审计在「无从比对」的情况下静默通过。
          git fetch --no-tags origin +main:refs/remotes/origin/main
          npm run ops:work-audit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - name: 构建时间监控（R7.10：>3 分钟报警）
        id: buildtime
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: ESLint（零警告门禁）
        run: npm run lint
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run build
      # R12.21 / R13.10 与 E2E 共用 Playwright Chromium；必须早于首个浏览器门禁安装。
      - run: npx playwright install --with-deps chromium
      - name: 320px 移动端溢出回归（R12.21 / R13.10）
        run: npm run check:mobile
      - name: 构建耗时核对（R7.10）
        run: |
          ELAPSED=$(( $(date +%s) - ${{ steps.buildtime.outputs.start }} ))
          echo "build segment elapsed: ${ELAPSED}s (includes lint/test/typecheck)"
          if [ "$ELAPSED" -gt 240 ]; then
            echo "::warning::构建链路超过 4 分钟（${ELAPSED}s），请检查大 chunk 与依赖体积"
          fi
      - run: npm run check:ai-copy
      - run: npm run check:growth-event-privacy
      - run: npm run check:error-report-privacy
      - name: 请求体字节上限审计（R15.4①：接收 JSON 的端点必须在读流阶段设闸）
        run: npm run check:request-body-bounds
      - run: npm run check:env-docs
      - run: npm run check:dark-pattern-copy
      - name: pgTAP 断言数与现行文档对账
        run: npm run check:db-assertion-counts
      - run: npm run check:docs
      - run: npm run check:changelog
      - name: 发布 tag 核对（R14.3：除最新发布版本外，每条发布记录都必须有同名 tag）
        run: npm run check:release-tag
      - run: npm run check:constitution
      - run: npm run check:frontmatter
      - run: npm run check:image-alt
      - run: npm run check:glossary
      - run: npm run check:slug-conflicts
      - run: npm run check:description-dupes
      - name: 上游版本指针核对（R10.18：指针/工作区/快照三者一致）
        run: npm run check:kb-pointer
      - name: 知识库内容 hash 基线核对（R10.7：只读，有漂移即失败）
        run: npm run check:kb-changelog
      - name: 翻译状态历史快照核对（R10.19）
        run: npm run check:translation-history
      - name: 关键章节英文 parity 预算（R10.20）
        run: npm run check:kb-parity-budget
      - name: 新章节 dry-run 冒烟（R10.16）
        run: |
          mkdir -p /tmp/draft-ch/demo
          printf '%s\n' \
            '---' \
            'title: 99 · 冒烟章节' \
            'description: 供 CI 验证 dry-run 命令可运行。' \
            '---' \
            '# 99 · 冒烟章节' \
            > /tmp/draft-ch/demo/README.md
          printf '%s\n' \
            '---' \
            'title: 01 · 冒烟课程' \
            'description: 冒烟用课程。' \
            '---' \
            '# 01 · 冒烟课程' \
            > /tmp/draft-ch/demo/intro.md
          node scripts/dry-run-new-chapter.mjs --draft /tmp/draft-ch/demo
      - run: npm run check:quiz-mounts
      - run: npm run check:quiz-coverage
      - run: npm run check:links
      - run: npm run check:sitemap
      - run: npm run check:seo-surface
      - run: npm run check:search-index
      - run: npm run check:nav-chain
      - run: npm run check:relative-links
      - run: npm run check:bundle
      - run: npm run check:structured-data
      - name: 生成内容质量报告（R10.1–R10.6 / R10.17）
        run: |
          npm run kb:inventory
          npm run kb:gap-priority
          npm run kb:accept
          npm run kb:translation-status
          npm run check:title-terminology
          npm run check:description-quality
          npm run check:risk-warning
      - name: 内容质量报告归档（R10.17）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: content-quality-reports
          path: |
            docs/*.json
            docs/glossary-coverage.md
            docs/description-dupes.md
            docs/description-quality.md
            docs/translation-status.md
            docs/new-course-acceptance.md
          retention-days: 7
      # R14.6：测试时钟卫生巡检。「断言里直接读墙钟」阻断（该口径无已知误报，真实命中已清零）；
      # 「真实定时器未受控」只写进 docs/test-clock-hygiene.md 排队人工判断。
      - name: 测试时钟卫生巡检（R14.6）
        run: npm run check:test-clock-hygiene
      # R16.21：字典死键预算为 0。字典里没人读的词条只会积累「已经不再成立的文案」，
      # 所以新造一个没人渲染的键直接判失败，而不是写进报告等人来看。
      - name: 字典死键巡检（R16.21）
        run: npm run check:dead-copy
      # E2E 放最后：运行时会向 .next 写入动态 fallback 页，避免污染产物校验
      - run: npm run e2e
      - run: npm run lhci

  # 数据层门禁（Q2.8 / Q5.4）：在真实 Supabase Postgres 镜像里应用迁移、跑 RLS 越权与
  # 双设备同步 pgTAP 测试，并执行 0008 回滚 → 重放演练。与 ci 作业并行，失败即阻断。
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: 拉取 Supabase Postgres 镜像
        run: docker pull supabase/postgres:17.6.1.155
      - name: 数据库门禁（迁移 / RLS 越权 / 双设备同步 / 回滚演练）
        run: node scripts/db-test.mjs
      - name: 备份恢复演练（Q5.4：dump / 全新实例恢复 / 指纹 / RLS 重跑）
        run: npm run backup:drill
